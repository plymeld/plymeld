pose.turn = "1 0 0 0 1 0 0 0 1"
# 0.00-9.20 mm flat; 9.20 mm to the top flat-follow, flat layers 0.2 mm · flat tops as laid (weighted score, together with the pose): 57 layers, stair-step 0.010 mm, layer lines 0.200 mm, weakest bond 6.0 mm², time ~29 min (quick estimate), support under 0 spot(s), ~0 mm³ (0.0 of 775.4 mm² held up) (~0.00 g)
technique.flat.layer.height = "0.2 mm"
mechanism.adhesion.first_layer.height = "0.2 mm"
band.1.technique = "flat"
band.1.heights = "one"
band.1.layer.height = "0.2 mm"
band.1.from = "0 mm"
