# Written by `plymeld plan`: the decisions it made. For `plymeld slice` every value here is a LOCK: it prints
# as planned and decides nothing again. For `plymeld plan` every value here is decided AGAIN, except one you
# write as "!value": that one is kept (a kept band, island, support spot or infill angle keeps the pose too).

[plan]
# all objects together, by height (the only usable order)
objects.printing = "together"

[plan.object."holeblock.stl"]
# pose 'as given (-Z down)' with flat layers of one height: one layer height throughout, everything below a height before anything above it, flat layers 0.3 mm: 0.0 mm² unsupported (0.0 mm² of it gets support, decided per overhang), 787.0 mm² flat on the bed, center of mass over the contact; 14 layers, stair-step 0.000 mm, layer lines 0.300 mm, weakest bond 787.0 mm², time ~3 min (quick estimate), support under 0 spot(s), ~0 mm³ (0.0 of 0.0 mm² held up) (~0.00 g); predicted in full by the finalists' slice (time -17.4 %, better against the baseline's 282 s)
pose.label = "as given (-Z down)"
pose.turn = "1 0 0 0 1 0 0 0 1"
# flat layers of one height: one layer height throughout, everything below a height before anything above it, flat layers 0.3 mm · flat tops as laid (weighted score, together with the pose): 14 layers, stair-step 0.000 mm, layer lines 0.300 mm, weakest bond 787.0 mm², time ~3 min (quick estimate), support under 0 spot(s), ~0 mm³ (0.0 of 0.0 mm² held up) (~0.00 g)
technique.flat.layer.height = "0.3 mm"
mechanism.adhesion.first_layer.height = "0.2 mm"
band.1.technique = "flat"
band.1.heights = "one"
band.1.layer.height = "0.3 mm"
band.1.from = "0 mm"
# support decided per overhang (plan.support.enabled unset): none chosen
support.enabled = "false"
# infill direction: 45 deg to the object's long axis as posed (0 deg from +X), so a grid's two line
# families cross it at the same angle and neither runs along it
layer.infill.angle = "45 deg"
# the flat tops' surface technique, weighed against as laid (no plan.faces.flat_top.technique lock): as laid won
faces.flat_top.technique = "as_laid"
# bond-first cooling, weighed (no plan.bond_cooling lock): the filament's cooling won; the filament's cooling: part fan 100 %, nozzle 205 C, minimum layer time 6 s
bond_cooling = "off"
# the seams, weighed (no plan.seam lock): scarf seams on the outer walls whose seam lands off a corner; the loops' seams at a corner when the loop has one (inside corners first), in line with the layer below; else the back
seam = "scarf_seam"
technique.scarf_seam.where = "smooth"
technique.scarf_seam.plain_style = "corner_seam"
# the in-island retraction, weighed (plan.mechanism.motion.no_retract_in_island unset): every travel retracts
mechanism.motion.no_retract_in_island = "false"

