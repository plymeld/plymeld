[hardware.model.flashforge-c5]
name = "Flashforge Creator 5"
profile_name = "Flashforge Creator 5"
dialect = "flashforge"
notes = """Built from one g-code file of Flashforge's own slicer for this machine, 2026-09-28.
No firmware config available: the stock firmware is Flashforge's own, so every command is 'observed' evidence only. Fans and heaters are not described yet.
The firmware homes and levels by itself when a print starts: Flashforge's own start sequence has no G28, no wait for the bed and no levelling, and its upload names levelling as an option of the print (levelingBeforePrint).
Toolhead underside, nozzle height and tip cone: not published by Flashforge; measured by hand on each of one machine's four heads (toolhead.*.evidence). The profile has no gantry.distance.
No square corner velocity from the firmware: the profile's machine_max_jerk (9), a different quantity, stands in for it as a placeholder (motion.square_corner_velocity) until the firmware's value is known."""
motion.speed.max = "600 mm/s"
motion.acceleration.max = "30000 mm/s2"
motion.z.speed.max = "20 mm/s"
motion.z.acceleration.max = "300 mm/s2"
motion.corner.speed = "9 mm/s"
evidence.motion.speed.max = "manufacturer_profile: Flashforge's slicer profile machine_max_speed_x/_y 600 (first value)"
evidence.motion.acceleration.max = "manufacturer_profile: Flashforge's slicer profile machine_max_acceleration_x/_y 30000 (first value)"
evidence.motion.z.speed.max = "manufacturer_profile: Flashforge's slicer profile machine_max_speed_z 20 (first value)"
evidence.motion.z.acceleration.max = "manufacturer_profile: Flashforge's slicer profile machine_max_acceleration_z 300 (first value)"
evidence.motion.corner.speed = "stand_in: NOT the firmware's value: a placeholder until the firmware's own is known. Flashforge's slicer profile machine_max_jerk_x 9 (a different quantity) stands in for it; replace with [printer] square_corner_velocity from the C5's printer.cfg when known"
build.x = "256 mm"
build.y = "256 mm"
build.z = "256 mm"
evidence.build = "manufacturer_profile: Flashforge's slicer profile printable_area 256 x 256 mm, printable_height 256 mm"
motion.print.speed = "300 mm/s"
evidence.motion.print.speed = "documented: Flashforge's Creator 5 specifications: print speed max. 300 mm/s, travel speed max. 600 mm/s (motion.speed.max)"
tool.heat.time = "15 s"
evidence.tool.heat.time = "stand_in: not measured: a pre-heat long enough to bring a parked tool back from its idle temperature for most of a change's wait, to be measured on the machine"
gcode.start = """M140 S{first_layer_bed_temperature}
M106 P101 S0 ; side fans (left and right) off
M106 P2 S0 ; center fresh-air fan off
M106 S0 ; model fan off
M106 P3 S0 ; filter unit fan off
G90
M83
G1 Z5 F2400
T{initial_tool}
M109 S{first_layer_nozzle_temperature} T{initial_tool}"""
gcode.end = """{if max_layer_z < max_print_height - 10}G1 Z{max_layer_z + 10}{else}G1 Z{max_print_height}{endif}
G1 X150 Y150 E-1.2 F12000
M106 P101 S0
M106 P2 S0
M106 S0
M106 P3 S0
M104 S0 T0
M104 S0 T1
M104 S0 T2
M104 S0 T3
M140 S0"""
gcode.pause = "M25"
gcode.pictures = "140x110"
evidence.gcode = """manufacturer_profile: gcode.start: Flashforge's slicer profile for this model, machine_start_gcode, the fans named as its comments name them; without its prime line (plymeld lays its own)
manufacturer_profile: gcode.end: the profile's machine_end_gcode (the move to X150 Y150 with a 1.2 mm retract); before it plymeld's lift clear of the print, 10 mm, within the build height (plymeld's choice), and after it the start's four fans and every tool's heater off
manufacturer_profile: gcode.pause: the profile's machine_pause_gcode, M25
manufacturer_profile: gcode.pictures: the profile's thumbnails, 140x110/PNG"""

