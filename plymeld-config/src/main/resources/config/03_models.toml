# plymeld's bundled machine models (docs/user/reference/bundled-data.md, "Machine models"): what each printer model
# accepts and is, each fact with its evidence. A machine names one by its key in
# hardware.machine.<key>.model. Your own printer: a [hardware.model.<key>] table in your config, `like` one of these
# to start from it (docs/user/how-to/describe-a-printer.md).
#
# A command's value is its evidence, one "kind: detail" per line (a "purpose: ..." line says what it does);
# kinds, strongest first: tested, measured, firmware_config, used_by_firmware, documented, manufacturer_profile, observed,
# stand_in.

[hardware.model.qidi-q2]
name = "QIDI Q2"
profile_name = "Q2"
dialect = "qidi"
notes = """Built from one machine's saved firmware config and the output of QIDI's slicer, 2026-09-28.
Box macros (BOX_TEMP_SET, UNLOAD_FILAMENT, ...) are not in the saved config: evidence is QIDI's slicer's output only.
Toolhead tip cone and underside outline: not published by QIDI; unknown until measured.
Observed commands added from a g-code of QIDI's slicer (2026-09-29): a plate of it with Box filament swaps (T1/T3)."""
motion.speed.max = "600 mm/s"
motion.acceleration.max = "20000 mm/s2"
motion.z.speed.max = "20 mm/s"
motion.z.acceleration.max = "500 mm/s2"
motion.corner.speed = "8 mm/s"
evidence.motion.speed.max = "firmware_config: [printer] max_velocity at q2_printer.cfg:118"
evidence.motion.acceleration.max = "firmware_config: [printer] max_accel at q2_printer.cfg:119"
evidence.motion.z.speed.max = "firmware_config: [printer] max_z_velocity at q2_printer.cfg:120"
evidence.motion.z.acceleration.max = "firmware_config: [printer] max_z_accel at q2_printer.cfg:121"
evidence.motion.corner.speed = "firmware_config: [printer] square_corner_velocity at q2_printer.cfg:122"
build.x = "270 mm"
build.y = "270 mm"
build.z = "256 mm"
evidence.build = "manufacturer_spec: QIDI's published build volume, 270 x 270 x 256 mm"
gcode.start = "PRINT_START BED={first_layer_bed_temperature} HOTEND={first_layer_nozzle_temperature}"
gcode.end = "PRINT_END"
evidence.gcode = """firmware_config: [gcode_macro PRINT_START] at q2_gcode_macro.cfg:213: heats the bed (BED), homes, cleans the nozzle, levels, heats the nozzle (HOTEND); CHAMBER unset = 0, the chamber fan on
firmware_config: [gcode_macro PRINT_END] at q2_gcode_macro.cfg:396: heaters, fans and motors off"""

[hardware.model.qidi-q2.fan.chamber_circulation_fan]
role = "chamber_circulation"
command = "M106 P3 S{s255}"
evidence = "[fan_generic chamber_circulation_fan] at q2_printer.cfg:330; command: M106 macro, q2_gcode_macro.cfg:605 (P3 -> chamber_circulation_fan)"

[hardware.model.qidi-q2.fan.chamber_fan]
role = "automatic"
evidence = "[controller_fan chamber_fan] at q2_printer.cfg:339; Klipper runs this fan itself"

[hardware.model.qidi-q2.fan.hotend_fan]
role = "automatic"
evidence = "[heater_fan hotend_fan] at q2_printer.cfg:354; Klipper runs this fan itself"

[hardware.model.qidi-q2.fan.cooling_fan]
role = "part_cooling"
command = "M106 P0 S{s255}"
evidence = "[fan_generic cooling_fan] at q2_printer.cfg:368; command: M106 macro, q2_gcode_macro.cfg:605 (P0 -> cooling_fan)"

[hardware.model.qidi-q2.fan.board_fan]
role = "automatic"
evidence = "[controller_fan board_fan] at q2_printer.cfg:380; Klipper runs this fan itself"

[hardware.model.qidi-q2.fan.auxiliary_cooling_fan]
role = "auxiliary_part_cooling"
command = "M106 P2 S{s255}"
evidence = "[fan_generic auxiliary_cooling_fan] at q2_printer.cfg:390; command: M106 macro, q2_gcode_macro.cfg:605 (P2 -> auxiliary_cooling_fan)"

[hardware.model.qidi-q2.heater.extruder]
section = "extruder"
temperature.max = "375 C"
evidence = "[extruder] at q2_printer.cfg:64; max_temp at q2_printer.cfg:75"

[hardware.model.qidi-q2.heater.heater_bed]
section = "heater_bed"
temperature.max = "125 C"
evidence = "[heater_bed] at q2_printer.cfg:273; max_temp at q2_printer.cfg:287"

[hardware.model.qidi-q2.heater.chamber]
section = "heater_generic"
temperature.max = "67 C"
evidence = "[heater_generic chamber] at q2_printer.cfg:289; max_temp at q2_printer.cfg:301"

[hardware.model.qidi-q2.toolhead.0]
head.radius = "75 mm"
gantry.height = "47 mm"
gantry.distance = "47 mm"
lid.height = "152 mm"
evidence = "manufacturer_profile: QIDI's own Q2 0.4 nozzle profile (in its slicer): extruder_clearance_max_radius 75, extruder_clearance_height_to_rod 47, extruder_clearance_dist_to_rod 47, extruder_clearance_height_to_lid 152; meanings as the profile format documents them"

