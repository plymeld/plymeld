name: Release

# A version tag (v0.20261102.0: v and the version, 0.YYYYMMDD.N) builds the native command line and window, that
# version passed to Gradle (-Pplymeld.version; a build without it is 0.0.0-dev), for
# Windows and Linux, packages them with Velopack (the Windows installer and portable zip, the AppImage, the update feeds),
# and uploads them, with the Linux command line's own tar, to a draft GitHub release for the maintainer to read and
# publish. Each platform builds and packages on its own runner, with the same tools/ scripts as a hand build, and runs
# every command on the executables it packages (tools/native-smoke.sh) before anything is published: the draft is
# created only once both platforms' executables have passed, and a failed case stops the release with no draft.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # the update feed the window and the command line check (baked into both by Gradle): plymeld.org/releases redirects to the latest release's files
  PLYMELD_FEED: https://plymeld.org/releases

jobs:
  version:
    name: The version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: The version, from the tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [[ "$ver" =~ ^0\.[0-9]{8}\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not v0.YYYYMMDD.N"; exit 1; }
          date -u -d "${ver:2:8}" +%Y%m%d > /dev/null 2>&1 || { echo "tag $GITHUB_REF_NAME: ${ver:2:8} is not a date"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux packages
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # GraalVM for JDK 21 with native-image (Oracle GraalVM); sets GRAALVM_HOME and JAVA_HOME. Pinned to the release the
      # window's native-image configuration was made with: 21.0.12 refuses its jni-config.json ("Record components cannot
      # be accessed through JNI registrations"), so a newer GraalVM waits until that configuration is brought up to date.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21.0.7'
          distribution: graalvm
          github-token: ${{ github.token }}
          # restores the Gradle caches release-cache.yml keeps on main (the Gradle distribution, the dependencies), so a
          # release needs no download from Gradle's or Maven's servers when its build files match main's
          cache: gradle
      - name: Check the Gradle wrapper jar
        run: echo "238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: The jars, the window's with Linux natives, and the icons
        # the compiler's heap as in CI (ci.yml): a release's version misses the build cache for everything downstream
        run: ./gradlew -Pplymeld.version="$VER" -Pkotlin.daemon.jvmargs=-Xmx2g :plymeld-cli:installDist :plymeld-ui:nativeLib :plymeld-ui:icons
      - name: The command line (and its tar, plymeld-linux-x64.tar.gz)
        run: tools/build-native.sh
      - name: The window
        run: tools/build-native-ui.sh build
      # one folder: the window with its libraries and lib/libjawt.so, the command line beside it
      - name: The package folder
        run: |
          pack="$RUNNER_TEMP/linux"; mkdir -p "$pack"
          cp -a plymeld-ui/build/native/. "$pack/"
          rm -rf "$pack/lib/"*.jar
          # the command line and any library native-image put beside it (the window's own copies kept); its lib/ is the
          # window's, there already, with anything the command line's holds
          for f in plymeld-cli/build/native/*; do case "$f" in *.txt) ;; *) if [ -d "$f" ]; then mkdir -p "$pack/${f##*/}"; cp -an "$f"/. "$pack/${f##*/}/"; else cp -an "$f" "$pack/"; fi ;; esac; done
      # every command, run by the executables as they ship: the tar's command line (its own folder, as the tar holds it),
      # and the AppImage's command line and window (the package folder, where the command line uses the window's copies
      # of the libraries both load); the window's executable, which the AppImage starts, held to running commands through
      # the command line beside it, as the AppImage runs them
      - name: Every command, run by the tar's command line
        run: tools/native-smoke.sh check plymeld-cli/build/native/plymeld "$RUNNER_TEMP/smoke-tar"
      - name: Every command, run by the AppImage's command line and window
        run: tools/native-smoke.sh check "$RUNNER_TEMP/linux/plymeld" --window "$RUNNER_TEMP/linux/plymeld-ui" "$RUNNER_TEMP/smoke-appimage"
      - name: Keep the smoke runs' files of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-smoke
          path: |
            ${{ runner.temp }}/smoke-tar/
            ${{ runner.temp }}/smoke-appimage/
          retention-days: 14
      - name: Install vpk (Velopack's packager)
        run: |
          dotnet tool install -g vpk
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: The AppImage and the feed (Velopack)
        run: |
          out="$RUNNER_TEMP/releases"; mkdir -p "$out"
          vpk pack --packId plymeld --packTitle plymeld --packVersion "$VER" --packDir "$RUNNER_TEMP/linux" --mainExe plymeld-ui \
            --icon plymeld-ui/build/icons/plymeld-256.png --channel linux --outputDir "$out"
          cp plymeld-cli/build/plymeld-linux-x64.tar.gz "$out/"
          # the checksum `plymeld update` checks the tar against before it replaces an installed command line
          (cd "$out" && sha256sum plymeld-linux-x64.tar.gz > plymeld-linux-x64.tar.gz.sha256)
      - name: Keep the packages for the draft
        uses: actions/upload-artifact@v7
        with:
          name: linux-releases
          path: ${{ runner.temp }}/releases/
          retention-days: 7

  windows:
    name: Windows packages
    needs: version
    runs-on: windows-latest
    timeout-minutes: 210
    env:
      VER: ${{ needs.version.outputs.version }}
      # native-image's builder heap for the window (tools/build-native-ui.cmd); the runner has 16 GB
      NATIVE_XMX: 12g
    steps:
      - uses: actions/checkout@v7
      # the same pinned GraalVM as the Linux job (see there)
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21.0.7'
          distribution: graalvm
          github-token: ${{ github.token }}
          # restores the Gradle caches release-cache.yml keeps on main (the Gradle distribution, the dependencies), so a
          # release needs no download from Gradle's or Maven's servers when its build files match main's
          cache: gradle
      - name: Check the Gradle wrapper jar
        shell: bash
        run: echo "238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      # the C++ build tools' environment script, wherever this runner's Visual Studio is
      - name: Find Visual Studio's vcvars64.bat
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "VS_VCVARS=$vs\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV
      - name: The jars, the window's with Windows natives, and the icons
        shell: cmd
        run: gradlew.bat -Pplymeld.version=%VER% -Pkotlin.daemon.jvmargs=-Xmx2g :plymeld-cli:installDist :plymeld-ui:windowsLib :plymeld-ui:icons
      - name: The command line
        shell: cmd
        env:
          PLYMELD_LIB: ${{ github.workspace }}\plymeld-cli\build\install\plymeld\lib
          PLYMELD_ICO: ${{ github.workspace }}\plymeld-ui\build\icons\plymeld.ico
          OUT: ${{ runner.temp }}\cli
        run: call tools\build-native.cmd || exit /b 1
      - name: The window
        shell: cmd
        env:
          PLYMELD_LIB: ${{ github.workspace }}\plymeld-ui\build\windows\lib
          PLYMELD_ICO: ${{ github.workspace }}\plymeld-ui\build\icons\plymeld.ico
          META: ${{ github.workspace }}\plymeld-ui\src\main\resources\META-INF\native-image\com.plymeld\plymeld-ui
          OUT: ${{ runner.temp }}\ui
        run: call tools\build-native-ui.cmd build || exit /b 1
      # the window with its DLLs and bin\jawt.dll at the root; the command line with ITS OWN DLLs and lib\ (its fonts'
      # configuration) under cli\ (native-image's stub DLLs differ per image); not the icon's build files
      - name: The package folder
        shell: pwsh
        run: |
          $win = "$env:RUNNER_TEMP\win"
          New-Item -ItemType Directory -Force "$win\cli", "$win\bin" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\ui\*.exe", "$env:RUNNER_TEMP\ui\*.dll" $win
          Copy-Item "$env:RUNNER_TEMP\ui\bin\*" "$win\bin"
          Copy-Item "$env:RUNNER_TEMP\cli\*.exe", "$env:RUNNER_TEMP\cli\*.dll" "$win\cli"
          Copy-Item -Recurse "$env:RUNNER_TEMP\cli\lib" "$win\cli\lib"
      # every command, run by the executables the installer and the portable zip carry (Git's bash runs the script); the
      # window's executable held to running commands through the command line under cli\, as the launcher runs them
      - name: Every command, run by the command line and the window
        shell: bash
        run: |
          t="$(cygpath -u "$RUNNER_TEMP")"
          tools/native-smoke.sh check "$t/win/cli/plymeld.exe" --window "$t/win/plymeld-ui.exe" "$t/smoke"
      - name: Keep the smoke run's files of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke
          path: ${{ runner.temp }}/smoke/
          retention-days: 14
      # on PATH for the steps after this one, so package-velopack.cmd finds it there (its fallback is a per-user .NET)
      - name: Install vpk (Velopack's packager)
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: The installer, the portable zip and the feed (Velopack)
        shell: cmd
        env:
          PLYMELD_WIN: ${{ runner.temp }}\win
          PLYMELD_ICONS: ${{ github.workspace }}\plymeld-ui\build\icons
          OUT: ${{ runner.temp }}\releases
        run: call tools\package-velopack.cmd %VER% win || exit /b 1
      - name: Keep the packages for the draft
        uses: actions/upload-artifact@v7
        with:
          name: windows-releases
          path: ${{ runner.temp }}\releases\
          retention-days: 7
      # when the cache missed, setup-graalvm saves it after the job, which on Windows fails while a Gradle or Kotlin
      # daemon (java.exe) still holds its files open
      - name: Stop the build's daemons
        if: always()
        shell: cmd
        run: taskkill /F /IM java.exe /T || exit /b 0

  # only once both platforms' executables have passed: the draft, with every package
  draft:
    name: Draft release
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-releases'
          merge-multiple: true
          path: ${{ runner.temp }}/releases
      - name: The draft release (its notes are written from CHANGELOG.md before it is published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "plymeld $VER" --notes "Notes to come from CHANGELOG.md." "$RUNNER_TEMP"/releases/*
