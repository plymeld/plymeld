name: Idea
description: Something plymeld could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What plymeld would do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would let you print or do, and how you manage without it now.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Pictures, models, papers, or prints that show it.
