name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still going: only the newest commit's result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Kotlin compiler's heap on the runners (-Pkotlin.daemon.jvmargs on each Gradle run that compiles): by default it
# takes the Gradle daemon's, which runs out compiling the test code and the window at once when the build cache misses
# (a version change misses it for everything that depends on plymeld-commands). 2 GB is plymeld's choice, a fraction of
# the runner's memory; local builds keep the default.

jobs:
  # Whether the change touches documentation only (Markdown anywhere, docs/, LICENSE, NOTICE). Then only the tests that
  # read the docs run (the docs job); anything else, or a change it cannot tell (a new branch, a manual run), runs all.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docs_only=false
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" "$HEAD")
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '\.md$|^docs/|^LICENSE$|^NOTICE$'; then docs_only=true; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation tests
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check the Gradle wrapper jar
        run: echo "238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      # the test that reads the docs: every config path, link, and command they name exists
      - name: The tests that read the documentation
        run: ./gradlew :plymeld-commands:test --tests 'plymeld.commands.DocsConsistencyTest'
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

  fast:
    name: Build and fast tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # JDK 21; Gradle's caches (dependencies, wrapper) by setup-java's own cache, so no further action or license is
      # involved.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # The wrapper jar is Gradle's published one for 9.8.0 (the distribution itself is pinned by its SHA-256 in
      # gradle/wrapper/gradle-wrapper.properties).
      - name: Check the Gradle wrapper jar
        run: echo "238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Every test but the slow suites (tools/slow-suites.txt)
        run: ./gradlew -Pkotlin.daemon.jvmargs=-Xmx2g fastTest --continue
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fast-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

  # tools/regress.sh against the pull request's base: the fixed cases' g-code, byte for byte apart from the version that
  # wrote it and the source block's line numbers and fingerprint. A deliberate change to the
  # output fails it on purpose; the pull request then explains each case that differs (CONTRIBUTING.md). The base is
  # built in a temporary worktree each run (no cache of baselines between runs).
  regress:
    name: Same g-code as the base
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check the Gradle wrapper jar
        run: echo "238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: The fixed cases, sliced by the base and by this pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: tools/regress.sh check --base "$BASE"
      - name: Keep both sets of g-code when they differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regress-gcode
          path: |
            build/regress/
            ~/.cache/plymeld-regress/
          retention-days: 14

  # The tests above run on the JVM; the release ships the command line as a GraalVM native image, which reaches what
  # native-image cannot see (the JDK's imaging and its JNI calls, reflection, resources) only through its reachability
  # metadata (plymeld-cli/src/main/resources/META-INF/native-image). This builds that native command line as the
  # release does and runs every command with it (tools/native-smoke.sh). The window's Linux native build is left to the
  # release, which smokes it on both platforms: it takes most of a runner's memory and much longer; the Windows job
  # below builds the Windows one, the platform whose argument handling and imaging differ.
  native:
    name: Native command line
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # the release's pinned GraalVM (release.yml)
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21.0.7'
          distribution: graalvm
          github-token: ${{ github.token }}
          cache: gradle
      - name: Check the Gradle wrapper jar
        run: echo "238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: The command line's jars
        run: ./gradlew -Pkotlin.daemon.jvmargs=-Xmx2g :plymeld-cli:installDist
      - name: The native command line
        run: tools/build-native.sh
      - name: Every command, run by the native command line
        run: tools/native-smoke.sh check plymeld-cli/build/native/plymeld "$RUNNER_TEMP/smoke"
      - name: Keep the smoke run's files of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-smoke
          path: ${{ runner.temp }}/smoke/
          retention-days: 14

  # The same on Windows, where the executables differ from Linux's in what the platform gives them: the C runtime that
  # reads their arguments, and the JDK's imaging, which reaches JNI members of its own. The command line and the window
  # are built as the release builds them (release.yml's Windows job, up to its smoke step) and every command is run by
  # both, as the installer and the portable zip carry them.
  native-windows:
    name: Native command line and window on Windows
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # native-image's builder heap for the window (tools/build-native-ui.cmd); the runner has 16 GB
      NATIVE_XMX: 12g
    steps:
      - uses: actions/checkout@v7
      # the release's pinned GraalVM (release.yml)
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21.0.7'
          distribution: graalvm
          github-token: ${{ github.token }}
          cache: gradle
      - name: Check the Gradle wrapper jar
        shell: bash
        run: echo "238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Find Visual Studio's vcvars64.bat
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "VS_VCVARS=$vs\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV
      - name: The jars, the window's with Windows natives, and the icons
        shell: cmd
        run: gradlew.bat -Pkotlin.daemon.jvmargs=-Xmx2g :plymeld-cli:installDist :plymeld-ui:windowsLib :plymeld-ui:icons
      - name: The command line
        shell: cmd
        env:
          PLYMELD_LIB: ${{ github.workspace }}\plymeld-cli\build\install\plymeld\lib
          PLYMELD_ICO: ${{ github.workspace }}\plymeld-ui\build\icons\plymeld.ico
          OUT: ${{ runner.temp }}\cli
        run: call tools\build-native.cmd || exit /b 1
      - name: The window
        shell: cmd
        env:
          PLYMELD_LIB: ${{ github.workspace }}\plymeld-ui\build\windows\lib
          PLYMELD_ICO: ${{ github.workspace }}\plymeld-ui\build\icons\plymeld.ico
          META: ${{ github.workspace }}\plymeld-ui\src\main\resources\META-INF\native-image\com.plymeld\plymeld-ui
          OUT: ${{ runner.temp }}\ui
        run: call tools\build-native-ui.cmd build || exit /b 1
      # the release's package folder: the window at the root, the command line under cli\
      - name: The package folder
        shell: pwsh
        run: |
          $win = "$env:RUNNER_TEMP\win"
          New-Item -ItemType Directory -Force "$win\cli", "$win\bin" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\ui\*.exe", "$env:RUNNER_TEMP\ui\*.dll" $win
          Copy-Item "$env:RUNNER_TEMP\ui\bin\*" "$win\bin"
          Copy-Item "$env:RUNNER_TEMP\cli\*.exe", "$env:RUNNER_TEMP\cli\*.dll" "$win\cli"
          Copy-Item -Recurse "$env:RUNNER_TEMP\cli\lib" "$win\cli\lib"
      - name: Every command, run by the command line and the window
        shell: bash
        run: |
          t="$(cygpath -u "$RUNNER_TEMP")"
          tools/native-smoke.sh check "$t/win/cli/plymeld.exe" --window "$t/win/plymeld-ui.exe" "$t/smoke"
      - name: Keep the smoke run's files of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-windows-smoke
          path: ${{ runner.temp }}/smoke/
          retention-days: 14
      - name: Stop the build's daemons
        if: always()
        shell: cmd
        run: taskkill /F /IM java.exe /T || exit /b 0

  slow:
    name: Slow tests
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check the Gradle wrapper jar
        run: echo "238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      # the window's tests open an OpenGL context and drive the window: a virtual display (Xvfb) with Mesa's software OpenGL
      - name: A display for the window's tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: The slow suites alone (tools/slow-suites.txt)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew -Pkotlin.daemon.jvmargs=-Xmx2g slowTest --continue
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: slow-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
